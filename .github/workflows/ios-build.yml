name: iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show selected Xcode
        run: xcodebuild -version
      - name: Build for simulator (unsigned)
        run: >-
          xcodebuild -project ANC.xcodeproj -scheme ANC -sdk iphonesimulator
          -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Build for iPhone (unsigned compile check)
        run: >-
          xcodebuild -project ANC.xcodeproj -scheme ANC -sdk iphoneos
          -configuration Debug -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO build
      - name: Upload build products
        uses: actions/upload-artifact@v4
        with:
          name: ANC-unsigned-build-products
          path: |
            build/Build/Products
            build-device/Build/Products
          if-no-files-found: error
